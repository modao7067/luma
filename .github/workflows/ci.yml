name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: Static gates (no artifacts needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and production gates
        run: ./tools/luma verify --static
      - name: Hermetic Python unit tests
        run: |
          python3 tools/tests/browser/test_client.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          excluded = {
              'test_kimi_web_native.py',
              'test_native_owner_contract.py',
              'test_claude_pty.py',
              'test_idle_reclaim.py',
          }
          for test in sorted(Path('tools/tests/cli').glob('test_*.py')):
              if test.name in excluded:
                  continue
              print('RUN', test, flush=True)
              subprocess.run([sys.executable, str(test)], check=True)
          PY

  android:
    name: Compile, unit tests, lint, release packaging
    needs: static-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls -1 "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          fi
          { yes || true; } | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile all modules
        run: >
          ./gradlew --console=plain
          :apps:gui:compileDebugKotlin
      - name: JVM unit tests
        run: ./gradlew --console=plain :apps:gui:testDebugUnitTest
      - name: Lint
        run: >
          ./gradlew --console=plain
          :apps:gui:lintDebug
          :runtime:noroot:lintDebug :runtime:root:lintDebug
          :shared:terminal-view:lintDebug :shared:terminal-emulator:lintDebug
      - name: Unsigned release packaging
        run: ./gradlew --console=plain :apps:gui:assembleRelease
