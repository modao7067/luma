apply from: rootProject.file('gradle/android-common.gradle')

def signingHome = rootProject.file('apps/gui')
def releasePropsFile = new File(signingHome, 'signing/luma-release.properties')
def releaseProps = new Properties()
def releaseKeystoreFile = null
if (releasePropsFile.isFile()) {
    releasePropsFile.withInputStream { releaseProps.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { propName ->
        def value = releaseProps.getProperty(propName)
        if (value == null || value.trim().isEmpty()) {
            throw new org.gradle.api.GradleException("Missing or blank '${propName}' in ${releasePropsFile}")
        }
    }
    def storePath = releaseProps.getProperty('storeFile').trim()
    releaseKeystoreFile = new File(storePath).isAbsolute() ? new File(storePath) : new File(signingHome, storePath)
    if (!releaseKeystoreFile.isFile()) {
        throw new org.gradle.api.GradleException("Release keystore file not found: ${releaseKeystoreFile}")
    }
}

android {
    buildFeatures { compose true; buildConfig true; resValues true }
    signingConfigs {
        release {
            if (releasePropsFile.isFile()) {
                storeFile releaseKeystoreFile
                storePassword releaseProps.getProperty('storePassword')
                keyAlias releaseProps.getProperty('keyAlias').trim()
                keyPassword releaseProps.getProperty('keyPassword')
                enableV1Signing false; enableV2Signing true; enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true; shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), rootProject.file('apps/gui/app/proguard-rules.pro')
            if (releasePropsFile.isFile()) signingConfig signingConfigs.release
        }
    }
    androidResources { noCompress += ['zip', 'xz']; ignoreAssetsPattern = '!.svn:!.git:!.DS_Store:!*~:!__pycache__:!*.pyc:!*.pyo' }
    testOptions { unitTests.all { systemProperty 'user.language', 'zh'; systemProperty 'user.country', 'CN' } }
    packaging { jniLibs { useLegacyPackaging = true } }
}
