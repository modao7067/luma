[versions]
agp = "9.5.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
composeRuntime = "1.12.1"
composeIcons = "1.7.8"
activityCompose = "1.13.0"
androidxAnnotation = "1.11.0"
okhttp = "5.5.1"
coroutines = "1.11.0"
androidsvg = "1.4"
commonmark = "0.32.0"
jlatexmath = "0.2.0"
highlights = "1.0.0"
serializationJson = "1.8.1"
xz = "1.12"
junit = "4.13.2"
orgJson = "20260814"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
androidsvg = { module = "com.caverock:androidsvg-aar", version.ref = "androidsvg" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-gfm-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
jlatexmath-android = { module = "ru.noties:jlatexmath-android", version.ref = "jlatexmath" }
highlights = { module = "dev.snipme:highlights", version.ref = "highlights" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "composeRuntime" }
compose-runtime-saveable = { module = "androidx.compose.runtime:runtime-saveable", version.ref = "composeRuntime" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "composeIcons" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
